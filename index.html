<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>malludino.gg</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Montserrat',sans-serif;background:#f2f2f2;text-align:center;color:#222;}
h1{margin-top:40px;font-size:42px;letter-spacing:2px;}
.subtitle{font-size:14px;color:#666;margin-bottom:40px;}
#menu{margin-top:30px;}
.menuCard{background:white;width:90%;max-width:400px;margin:0 auto;padding:40px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.1);}
button{padding:14px 35px;margin:10px;font-size:15px;border-radius:40px;border:none;cursor:pointer;transition:0.25s;}
.primaryBtn{background:#222;color:white;}
.primaryBtn:hover{background:#000;transform:scale(1.05);}
.secondaryBtn{background:#e5e5e5;}
.secondaryBtn:hover{background:#d0d0d0;transform:scale(1.05);}
canvas{display:none;margin:40px auto;background:white;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,0.15);width:95%;max-width:900px;height:auto;}
#score{display:none;font-weight:bold;margin-top:10px;}
#gameOver{display:none;margin-top:20px;}
#exitBtn{display:none;}
.usernameWrapper{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:10px;}
#usernameInput{padding:12px 15px;border-radius:30px;border:1px solid #ccc;width:70%;font-size:14px;}
#confirmNameBtn{background:#2ecc71;color:white;border:none;width:45px;height:45px;border-radius:50%;font-size:18px;cursor:pointer;transition:0.2s;}
#confirmNameBtn:hover{transform:scale(1.1);background:#27ae60;}
#nameStatus{display:none;color:#2ecc71;font-size:13px;margin-bottom:15px;}
#leaderboard{margin:40px auto;width:90%;max-width:500px;}
.lbTitle{font-weight:bold;margin-bottom:15px;}
.lbItem{display:flex;align-items:center;justify-content:space-between;background:#1e1e1e;color:white;padding:12px 15px;border-radius:12px;margin-bottom:10px;font-size:14px;transition:0.3s;}
.lbLeft{display:flex;align-items:center;gap:10px;}
.lbRank{width:25px;text-align:center;opacity:0.7;}
.lbAvatar{width:30px;height:30px;border-radius:50%;background:#444;display:flex;align-items:center;justify-content:center;font-size:12px;}
.lbScore{opacity:0.8;}
.lbYou{background:#2ecc71 !important;color:black;font-weight:bold;}
.socialBtn{display:inline-block;margin-top:15px;padding:10px 25px;border-radius:30px;background:#000;color:white;text-decoration:none;transition:0.3s;}
.socialBtn:hover{transform:scale(1.1);background:#333;}
#credits{margin-top:80px;padding:30px;font-size:14px;color:#777;}
@media(max-width:600px){
h1{font-size:28px;}
button{width:80%;font-size:16px;}
}
</style>
</head>

<body>

<h1>malludino.gg</h1>
<div class="subtitle">StylishDinos</div>

<div id="menu">
<div class="menuCard">
<h2>Select Mode</h2>

<div class="usernameWrapper">
<input id="usernameInput" placeholder="Enter Username">
<button id="confirmNameBtn">✅</button>
</div>
<p id="nameStatus">Username confirmed!</p>

<div id="modeButtons"></div>
</div>
</div>

<div id="leaderboard"></div>

<canvas id="gameCanvas" width="900" height="250"></canvas>
<div id="score">Score: 0</div>
<button id="exitBtn" class="secondaryBtn" onclick="backToMenu()">Exit</button>

<div id="gameOver">
<h3>Game over!!</h3>
<button class="primaryBtn" onclick="restartGame()">Restart</button>
<button class="secondaryBtn" onclick="backToMenu()">Menu</button>
</div>

<div id="credits">
Crafted by <b>ZebbyAnnan😇</b><br>
malludino.gg © 2026<br>
<a class="socialBtn"
href="https://www.instagram.com/i.wziee?igsh=MTZqbXplNDY0b253Yw=="
target="_blank">Instagram</a>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
getFirestore, 
collection, 
getDocs, 
query, 
orderBy, 
limit,
doc,
getDoc,
setDoc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import { GAME_MODES, getMode, getAvailableModes } from "./modes.js";

const firebaseConfig = {
apiKey: "AIzaSyA9I4oU9khFGycZyIOvHcg3p6OrhSa1GzM",
authDomain: "malludino-gg.firebaseapp.com",
projectId: "malludino-gg",
storageBucket: "malludino-gg.firebasestorage.app",
messagingSenderId: "298331255490",
appId: "1:298331255490:web:87440667c24a55c289c15b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* Load images for all modes */
const modeImages = {};
Object.entries(GAME_MODES).forEach(([modeKey, modeConfig]) => {
  const img = new Image();
  img.src = modeConfig.character;
  modeImages[modeKey] = img;
});

/* Death Sound */
const deathSound = new Audio("audio/ayoo.mp3");
let savedUsername="";

// Render mode buttons dynamically
function renderModeButtons() {
  const container = document.getElementById("modeButtons");
  const modes = getAvailableModes();
  
  container.innerHTML = modes.map((mode, index) => {
    const btnClass = index === 0 ? "primaryBtn" : "secondaryBtn";
    return `<button class="${btnClass}" onclick="startGame('${mode.id}')">${mode.name}</button>`;
  }).join("");
}

document.getElementById("confirmNameBtn").addEventListener("click",()=>{
const input=document.getElementById("usernameInput").value.trim();
if(input.length<2){alert("Enter valid username!");return;}
savedUsername=input;
document.getElementById("nameStatus").style.display="block";
});

async function saveScore(username, score) {

    const userRef = doc(db, "scores", username);
    const userSnap = await getDoc(userRef);

    if (userSnap.exists()) {
        const existingScore = userSnap.data().score;

        if (score > existingScore) {
            await setDoc(userRef, {
                name: username,
                score: score,
                timestamp: Date.now()
            });
        }

    } else {
        await setDoc(userRef, {
            name: username,
            score: score,
            timestamp: Date.now()
        });
    }
}

function updateLeaderboardUI(snapshot) {
let html=`<div class="lbTitle">🏆 Global Leaderboard</div>`;
let rank=1;
snapshot.forEach(doc=>{
const d=doc.data();
const isYou=d.name===savedUsername;
html+=`
<div class="lbItem ${isYou?"lbYou":""}">
<div class="lbLeft">
<div class="lbRank">${rank}</div>
<div class="lbAvatar">${d.name.charAt(0).toUpperCase()}</div>
<div>${d.name}</div>
</div>
<div class="lbScore">${d.score} pts</div>
</div>`;
rank++;
});
document.getElementById("leaderboard").innerHTML=html;
}

function setupLeaderboardListener(){
const q=query(collection(db,"scores"),orderBy("score","desc"),limit(10));
onSnapshot(q, (snapshot) => {
updateLeaderboardUI(snapshot);
}, (error) => {
console.error("Leaderboard listener error:", error);
});
}

document.addEventListener("DOMContentLoaded",() => {
  renderModeButtons();
  setupLeaderboardListener();
});

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

let mode="normal",dinoY=170,velocity=0,gravity=0.7,jumping=false;
let speed=6,score=0,gameRunning=false;
let obstacles=[];
let clouds=[];
let currentModeConfig=null;
let jumpSound=null;

// Draw dot-style cactus
function drawCactus(x, y, width, height) {
  const dotSize = 4;
  const dotSpacing = 6;
  
  // Draw cactus outline using dots
  for (let i = 0; i < width; i += dotSpacing) {
    for (let j = 0; j < height; j += dotSpacing) {
      ctx.fillStyle = "#8BC34A";
      ctx.beginPath();
      ctx.arc(x + i, y + j, dotSize, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  // Draw left arm
  const armY = y + height * 0.3;
  for (let i = 0; i < 12; i += dotSpacing) {
    for (let j = 0; j < 6; j += dotSpacing) {
      ctx.fillStyle = "#8BC34A";
      ctx.beginPath();
      ctx.arc(x - i, armY + j, dotSize, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  // Draw right arm
  for (let i = 0; i < 12; i += dotSpacing) {
    for (let j = 0; j < 6; j += dotSpacing) {
      ctx.fillStyle = "#8BC34A";
      ctx.beginPath();
      ctx.arc(x + width + i, armY + j, dotSize, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// Draw clouds
function drawCloud(x, y) {
  ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
  
  const cloudWidth = 60;
  const cloudHeight = 25;
  
  // Draw cloud using circles
  ctx.beginPath();
  ctx.arc(x, y, 15, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.beginPath();
  ctx.arc(x + 20, y, 18, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.beginPath();
  ctx.arc(x + 40, y, 15, 0, Math.PI * 2);
  ctx.fill();
}

// Initialize clouds
function initializeClouds() {
  clouds = [];
  for (let i = 0; i < 3; i++) {
    clouds.push({
      x: Math.random() * canvas.width,
      y: 30 + Math.random() * 40,
      speed: 1 + Math.random() * 1.5
    });
  }
}

function startGame(selectedMode){
if(!savedUsername){alert("Confirm username first!");return;}
mode=selectedMode;
currentModeConfig = getMode(mode);

// Load jump sound for this mode
jumpSound = new Audio(currentModeConfig.jumpSound);
jumpSound.volume = 1;

// Initialize game variables from mode config
dinoY = currentModeConfig.dinoStartY;
velocity = 0;
gravity = currentModeConfig.gravity;
speed = currentModeConfig.initialSpeed;
score = 0;

obstacles=[];
initializeClouds();
document.getElementById("menu").style.display="none";
document.getElementById("leaderboard").style.display="none";
canvas.style.display="block";
document.getElementById("score").style.display="block";
document.getElementById("exitBtn").style.display="inline-block";
document.getElementById("gameOver").style.display="none";
gameRunning=true;
gameLoop();
}

function jump(){
if(!jumping && gameRunning){
velocity = currentModeConfig.jumpForce;
jumping = true;

try{
jumpSound.currentTime = 0;
jumpSound.play();
}catch(e){}
}
}
document.addEventListener("keydown",jump);
canvas.addEventListener("click",jump);

function spawnObstacle(){
const randomHeight=30+Math.random()*30;
obstacles.push({x:canvas.width+40,width:20,height:randomHeight});
}

function update(){
ctx.clearRect(0,0,canvas.width,canvas.height);

// Draw clouds
clouds.forEach(cloud => {
  cloud.x -= cloud.speed;
  
  // Reset cloud position if it goes off screen
  if (cloud.x < -80) {
    cloud.x = canvas.width + 40;
    cloud.y = 30 + Math.random() * 40;
  }
  
  drawCloud(cloud.x, cloud.y);
});

velocity+=gravity;
dinoY+=velocity;
if(dinoY>=currentModeConfig.dinoStartY){dinoY=currentModeConfig.dinoStartY;velocity=0;jumping=false;}

if(obstacles.length===0||obstacles[obstacles.length-1].x<canvas.width-350)
spawnObstacle();

for(let i=0;i<obstacles.length;i++){
obstacles[i].x-=speed;

// Draw dot-style cactus instead of rectangle
drawCactus(obstacles[i].x, currentModeConfig.groundY-obstacles[i].height, obstacles[i].width, obstacles[i].height);

let dinoLeft=80,dinoRight=130,dinoTop=dinoY,dinoBottom=dinoY+currentModeConfig.dinoHeight;
let cactusLeft=obstacles[i].x,cactusRight=obstacles[i].x+obstacles[i].width;
let cactusTop=currentModeConfig.groundY-obstacles[i].height,cactusBottom=currentModeConfig.groundY;

if(dinoRight>cactusLeft&&dinoLeft<cactusRight&&dinoBottom>cactusTop&&dinoTop<cactusBottom){
endGame();
}
}

if(obstacles.length>0&&obstacles[0].x<-50){
obstacles.shift();
score++;
document.getElementById("score").innerText="Score: "+score;
}

ctx.beginPath();
ctx.moveTo(0,currentModeConfig.groundY);
ctx.lineTo(canvas.width,currentModeConfig.groundY);
ctx.stroke();

const currentImg=modeImages[mode];
ctx.drawImage(currentImg,80,dinoY,currentModeConfig.dinoWidth,currentModeConfig.dinoHeight);
}

function gameLoop(){
if(!gameRunning)return;
update();
requestAnimationFrame(gameLoop);
}

function endGame(){
if(!gameRunning)return;
gameRunning=false;
document.getElementById("gameOver").style.display="block";
deathSound.currentTime=0;
deathSound.play().catch(()=>{});
saveScore(savedUsername,score);
}

function restartGame(){
obstacles=[];dinoY=currentModeConfig.dinoStartY;velocity=0;score=0;
document.getElementById("score").innerText="Score: 0";
document.getElementById("gameOver").style.display="none";
gameRunning=true;
gameLoop();
}

function backToMenu(){
gameRunning=false;
obstacles=[];dinoY=170;velocity=0;score=0;
document.getElementById("score").style.display="none";
document.getElementById("exitBtn").style.display="none";
document.getElementById("gameOver").style.display="none";
canvas.style.display="none";
document.getElementById("menu").style.display="block";
document.getElementById("leaderboard").style.display="block";
}

window.startGame=startGame;
window.restartGame=restartGame;
window.backToMenu=backToMenu;

</script>
</body>
</html>
