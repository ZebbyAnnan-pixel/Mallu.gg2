<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dino Game - MalluDino</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f7f7f7;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 300px;
            border-bottom: 2px solid #535353;
            overflow: hidden;
        }
        #dino {
            position: absolute;
            width: 50px;
            height: 50px;
            bottom: 0;
            left: 50px;
            /* Updated path to point to the 'image' folder */
            background-image: url('image/rishi.png'); 
            background-size: cover;
            background-position: center;
        }
        #obstacle {
            position: absolute;
            width: 30px;
            height: 50px;
            bottom: 0;
            right: -30px;
            background-color: #535353;
        }
        .jump {
            animation: jump-anim 0.5s linear;
        }
        @keyframes jump-anim {
            0% { bottom: 0; }
            40% { bottom: 120px; }
            50% { bottom: 130px; }
            60% { bottom: 120px; }
            100% { bottom: 0; }
        }
        #score {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 30px;
            color: red;
            display: none;
            font-weight: bold;
        }
        .restart-btn {
            font-size: 16px;
            color: white;
            background: #535353;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="score">Score: <span id="score-val">0</span></div>
    
    <div id="game-container">
        <div id="dino"></div>
        <div id="obstacle"></div>
        <div class="game-over" id="game-over-text">
            GAME OVER<br>
            <button class="restart-btn" onclick="resetGame()">Restart</button>
        </div>
    </div>

    <audio id="jump-sfx" src="audio/jumpeffect.rishi.mp3"></audio>
    <audio id="die-sfx" src="audio/ayoo.mp3"></audio>

    <script>
        const dino = document.getElementById("dino");
        const obstacle = document.getElementById("obstacle");
        const scoreElement = document.getElementById("score-val");
        const gameOverText = document.getElementById("game-over-text");
        const jumpSound = document.getElementById("jump-sfx");
        const dieSound = document.getElementById("die-sfx");

        let isJumping = false;
        let isGameOver = false;
        let score = 0;
        let gameSpeed = 6;
        let obstaclePosition = 800;

        document.addEventListener("keydown", function(event) {
            if ((event.code === "Space" || event.code === "ArrowUp") && !isJumping && !isGameOver) {
                jump();
            }
        });

        document.getElementById("game-container").addEventListener("mousedown", function() {
            if (!isJumping && !isGameOver) jump();
        });

        function jump() {
            isJumping = true;
            dino.classList.add("jump");
            
            jumpSound.currentTime = 0;
            jumpSound.play().catch(e => console.log("Audio requires interaction first"));

            setTimeout(function() {
                dino.classList.remove("jump");
                isJumping = false;
            }, 500);
        }

        let gameInterval = setInterval(function() {
            if(isGameOver) return;

            obstaclePosition -= gameSpeed;
            
            if (obstaclePosition < -30) {
                obstaclePosition = 800;
                score++;
                scoreElement.innerText = score;
                gameSpeed += 0.2; 
            }
            obstacle.style.right = (800 - obstaclePosition - 30) + "px";

            let dinoTop = parseInt(window.getComputedStyle(dino).getPropertyValue("bottom"));
            
            if (obstaclePosition > 50 && obstaclePosition < 100 && dinoTop < 50) {
                gameOver();
            }
        }, 20);

        function gameOver() {
            isGameOver = true;
            gameOverText.style.display = "block";
            
            dieSound.currentTime = 0;
            dieSound.play().catch(e => console.log("Audio requires interaction first"));
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            gameSpeed = 6;
            obstaclePosition = 800;
            scoreElement.innerText = score;
            gameOverText.style.display = "none";
        }
    </script>
</body>
</html>
